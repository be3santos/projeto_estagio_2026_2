<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel — BoardGame Café</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Nunito&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Nunito', sans-serif; background-color: #f4ead9; }
        .brand { font-family: 'Fredoka', sans-serif; }
        .badge-pendente { background-color: #e0a83b; }
        .badge-confirmado { background-color: #4c7a4c; }
        .badge-cancelado { background-color: #a34c4c; }
        table thead { background-color: #4a2c1d; color: white; }
        .table-responsive { border-radius: 0.9rem; overflow-x: auto; box-shadow: 0 2px 10px rgba(74,44,29,0.06); }
    </style>
</head>
<body>

<nav class="navbar navbar-dark" style="background-color: #4a2c1d;">
    <div class="container-fluid px-4">
        <a class="navbar-brand brand" href="/">Painel — BoardGame Café</a>        <form th:action="@{/logout}" method="post" class="d-flex">
            <button class="btn btn-outline-light btn-sm" type="submit">Sair</button>
        </form>
    </div>
</nav>

<div class="container py-4">

    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3">
        <h1 class="h5 mb-2 mb-md-0">Reservas recebidas</h1>
        <div class="btn-group btn-group-sm" role="group">
            <a href="/admin/painel" class="btn btn-outline-secondary" th:classappend="${filtroAtual == ''} ? 'active'">Todas</a>
            <a href="/admin/painel?status=PENDENTE" class="btn btn-outline-secondary" th:classappend="${filtroAtual == 'PENDENTE'} ? 'active'">Pendentes</a>
            <a href="/admin/painel?status=CONFIRMADO" class="btn btn-outline-secondary" th:classappend="${filtroAtual == 'CONFIRMADO'} ? 'active'">Confirmados</a>
            <a href="/admin/painel?status=CANCELADO" class="btn btn-outline-secondary" th:classappend="${filtroAtual == 'CANCELADO'} ? 'active'">Cancelados</a>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(reservas)}" class="text-center py-5">
        <p class="text-muted">Nenhuma reserva por aqui ainda. Assim que alguém reservar uma mesa, ela aparece nesta lista.</p>
    </div>

    <div class="table-responsive" th:unless="${#lists.isEmpty(reservas)}">
        <table class="table table-hover align-middle mb-0 bg-white">
            <thead>
            <tr>
                <th>Nome</th>
                <th>Email</th>
                <th>Categoria</th>
                <th>Jogo</th>
                <th>Pessoas</th>
                <th>Data</th>
                <th>Horário</th>
                <th>Status</th>
                <th>Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${reservas}">
                <td th:text="${r.nome}"></td>
                <td th:text="${r.email}" class="small"></td>
                <td th:text="${r.categoriaJogo.rotulo}"></td>
                <td th:text="${r.jogoEscolhido != null and !r.jogoEscolhido.isBlank()} ? ${r.jogoEscolhido} : '—'"></td>
                <td th:text="${r.numeroPessoas}"></td>
                <td th:text="${#temporals.format(r.dataReserva, 'dd/MM/yyyy')}"></td>
                <td th:text="${#temporals.format(r.horario, 'HH:mm')}"></td>
                <td>
                    <span class="badge badge-pendente" th:if="${r.status.name() == 'PENDENTE'}">Pendente</span>
                    <span class="badge badge-confirmado" th:if="${r.status.name() == 'CONFIRMADO'}">Confirmado</span>
                    <span class="badge badge-cancelado" th:if="${r.status.name() == 'CANCELADO'}">Cancelado</span>
                </td>
                <td>
                    <div class="d-flex gap-1" th:if="${r.status.name() == 'PENDENTE'}">
                        <form th:action="@{/admin/reservas/{id}/status(id=${r.id})}" method="post">
                            <input type="hidden" name="novoStatus" value="CONFIRMADO">
                            <button class="btn btn-sm btn-success" type="submit">Confirmar</button>
                        </form>
                        <form th:action="@{/admin/reservas/{id}/status(id=${r.id})}" method="post">
                            <input type="hidden" name="novoStatus" value="CANCELADO">
                            <button class="btn btn-sm btn-outline-danger" type="submit">Cancelar</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
