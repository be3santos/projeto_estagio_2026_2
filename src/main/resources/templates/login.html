<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Painel BoardGame Café</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Nunito&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Nunito', sans-serif; background-color: #4a2c1d; min-height: 100vh; display: flex; align-items: center; }
        .brand { font-family: 'Fredoka', sans-serif; }
        .login-card { background: #f4ead9; border-radius: 1rem; padding: 2.5rem; }
        .btn-laranja { background-color: #e0793b; border-color: #e0793b; color: white; font-weight: 700; }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-11 col-sm-7 col-md-5 col-lg-4">
            <div class="login-card">
                <h1 class="brand h4 text-center mb-4">🎲 Painel BoardGame Café</h1>

                <div th:if="${param.error}" class="alert alert-danger py-2 small">
                    Usuário ou senha inválidos.
                </div>
                <div th:if="${param.logout}" class="alert alert-success py-2 small">
                    Sessão encerrada.
                </div>

                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Usuário</label>
                        <input type="text" name="username" class="form-control" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Senha</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-laranja w-100 mt-2">Entrar</button>
                </form>
                <p class="text-center small text-muted mt-3 mb-0">
                    <a href="/" class="text-muted">← Voltar para o site</a>
                </p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
