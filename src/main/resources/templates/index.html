<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BoardGame Café — Reserve sua mesa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Nunito', sans-serif; background-color: #f4ead9; color: #4a2c1d; }
        h1, h2, h3, .brand { font-family: 'Fredoka', sans-serif; }
        .hero { background: linear-gradient(135deg, #4a2c1d 0%, #7a4b32 100%); color: #f4ead9; padding: 4rem 0 5rem; }
        .form-card { background: white; border-radius: 1.2rem; box-shadow: 0 8px 30px rgba(74,44,29,0.12); margin-top: -3.5rem; padding: 2.2rem; }
        .btn-laranja { background-color: #e0793b; border-color: #e0793b; color: white; font-weight: 700; }
        .btn-laranja:hover { background-color: #c96529; border-color: #c96529; color: white; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark" style="background-color: #4a2c1d;">
    <div class="container">
        <span class="navbar-brand brand">🎲 BoardGame Café</span>
        <a href="/login" class="text-decoration-none small text-white-50">Painel administrativo</a>
    </div>
</nav>

<section class="hero text-center">
    <div class="container">
        <h1>Sua mesa, seu jogo, sua rodada.</h1>
        <p class="lead">Escolha a categoria de jogo, reserve sua mesa e a gente separa tudo antes de você chegar.</p>
    </div>
</section>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="form-card">

                <div th:if="${sucesso}" class="alert alert-success">
                    ✅ Reserva enviada, <span th:text="${nomeConfirmado}"></span>! Status: <strong>pendente</strong>.
                </div>

                <h2 class="h4 mb-4">Reserve sua mesa</h2>

                <form th:action="@{/reservar}" th:object="${reserva}" method="post">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Nome</label>
                            <input type="text" class="form-control" th:field="*{nome}">
                            <div class="text-danger small" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" th:field="*{email}">
                            <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Categoria de jogo</label>
                            <select class="form-select" th:field="*{categoriaJogo}">
                                <option value="">Selecione...</option>
                                <option th:each="cat : ${categorias}" th:value="${cat}" th:text="${cat.rotulo}"></option>
                            </select>
                            <div class="text-danger small" th:if="${#fields.hasErrors('categoriaJogo')}" th:errors="*{categoriaJogo}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Jogo específico (opcional)</label>
                            <input type="text" class="form-control" placeholder="Ex: Catan" th:field="*{jogoEscolhido}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Número de pessoas</label>
                            <input type="number" min="1" max="12" class="form-control" th:field="*{numeroPessoas}">
                            <div class="text-danger small" th:if="${#fields.hasErrors('numeroPessoas')}" th:errors="*{numeroPessoas}"></div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Data</label>
                            <input type="date" class="form-control" th:min="${hoje}" th:max="${limiteData}" th:field="*{dataReserva}">
                            <div class="text-danger small" th:if="${#fields.hasErrors('dataReserva')}" th:errors="*{dataReserva}"></div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Horário</label>
                            <input type="time" class="form-control" th:field="*{horario}">
                            <div class="text-danger small" th:if="${#fields.hasErrors('horario')}" th:errors="*{horario}"></div>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-laranja w-100 mt-4 py-2">Reservar mesa 🎲</button>
                </form>

            </div>
        </div>
    </div>
    <footer class="text-center py-5 mt-3 small text-muted">BoardGame Café — Ter a Dom, 14h às 23h</footer>
</div>

</body>
</html>
